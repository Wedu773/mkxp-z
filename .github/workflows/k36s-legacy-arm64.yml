name: Build K36S Legacy ARM64

on:
  workflow_dispatch:

jobs:
  build-k36s:
    name: Ubuntu 18.04 ARM64 (glibc 2.27)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside Ubuntu 18.04 ARM64
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            arm64v8/ubuntu:18.04 \
            bash -lc '
              set -eux
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y \
                git wget ca-certificates \
                build-essential gcc g++ \
                cmake autoconf automake libtool pkg-config \
                python3 python3-pip python3-setuptools \
                ruby bison xxd \
                zlib1g-dev libbz2-dev \
                libasound2-dev libpulse-dev \
                libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
                libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
                libxi-dev libxinerama-dev libxss-dev libxxf86vm-dev

              python3 -m pip install --upgrade "pip<22" setuptools wheel
              python3 -m pip install "meson==0.61.5" "ninja==1.10.2.4"

              cd /work/linux
              make NPROC=2

              cd /work
              . linux/vars.sh
              meson setup build \
                --bindir=. \
                --prefix=/work/build/local \
                -Dgfx_backend=gles

              cd build
              ninja -j2
              ninja install

              cd /work/build/local
              cp -r /work/linux/build-aarch64/lib/ruby/3.1.0 ./stdlib
              cp /work/mkxp.json .
              cp -r /work/scripts .
              cp /work/assets/LICENSE.mkxp-z-with-https.txt .

              echo "Versiones requeridas por el binario:"
              strings ./mkxp-z.aarch64 | grep -E "GLIBC_[0-9]|GLIBCXX_|CXXABI_" | sort -Vu | tail -n 30 || true
            '

      - name: Upload K36S artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.k36s.ubuntu18.04.arm64
          path: build/local
          if-no-files-found: error
