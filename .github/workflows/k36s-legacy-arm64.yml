name: Build K36S Legacy ARM64 v7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-k36s:
    name: Ubuntu 18.04 ARM64 + GLES (K36S)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Create the ARM64 container build script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build-k36s-container.sh" <<'CONTAINER_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          trap 'rc=$?; echo; echo "[ERROR] Línea ${LINENO}: ${BASH_COMMAND}"; echo "[ERROR] Código de salida: ${rc}"; exit "${rc}"' ERR

          export DEBIAN_FRONTEND=noninteractive
          # El Makefile oficial presupone que el nivel superior se ejecuta
          # de forma secuencial. Solo paraleliza la compilación interna de cada
          # biblioteca mediante NPROC. Forzar MAKEFLAGS=-j2 aquí provoca carreras:
          # Vorbis puede configurarse antes de que Ogg haya sido instalado.
          unset MAKEFLAGS MFLAGS || true

          mkdir -p /work/build-logs

          # No se usa ningún programa opcional antes de instalarlo. La imagen
          # base es mínima y ni siquiera incluye git.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git file patch rsync \
            build-essential gcc g++ binutils cmake \
            autoconf automake libtool pkg-config \
            python3 python3-pip python3-setuptools \
            ruby bison xxd perl gettext gperf texinfo \
            patchelf \
            zlib1g-dev libbz2-dev libexpat1-dev \
            libasound2-dev libpulse-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxxf86vm-dev

          # Comprobación temprana para que cualquier carencia de la imagen
          # base se detecte aquí y no media hora después.
          for tool in git curl wget make gcc g++ cmake python3 ruby bison xxd pkg-config file readelf patchelf; do
            command -v "$tool" >/dev/null 2>&1 || { echo "Falta la herramienta: $tool" >&2; exit 1; }
          done
          git config --global --add safe.directory /work
          test -f /work/meson.build
          test -f /work/linux/Makefile
          test -f /work/linux/vars.sh

          # GCC 8 es preferible para dependencias modernas. Si no está en el
          # repositorio ARM64 de Bionic, se conserva el GCC 7 del sistema.
          if apt-cache show gcc-8 >/dev/null 2>&1 && apt-cache show g++-8 >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends gcc-8 g++-8
            export CC=gcc-8
            export CXX=g++-8
          else
            export CC=gcc
            export CXX=g++
          fi

          # El CMake 3.10 de Ubuntu 18.04 es demasiado antiguo para algunas
          # dependencias actuales de mkxp-z. Se usa un CMake oficial ARM64,
          # manteniendo glibc 2.27 como base de enlace.
          CMAKE_VERSION="3.28.6"
          CMAKE_ARCHIVE="cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
          CMAKE_BASE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}"
          cd /tmp
          curl --fail --location --retry 5 --retry-delay 3 \
            --output "${CMAKE_ARCHIVE}" "${CMAKE_BASE_URL}/${CMAKE_ARCHIVE}"
          curl --fail --location --retry 5 --retry-delay 3 \
            --output "cmake-SHA-256.txt" "${CMAKE_BASE_URL}/cmake-${CMAKE_VERSION}-SHA-256.txt"
          CMAKE_SHA256="$(awk -v file="${CMAKE_ARCHIVE}" '$2 == file || $2 == "*" file {print $1; exit}' cmake-SHA-256.txt)"
          if [ -z "${CMAKE_SHA256}" ]; then
            echo "No se encontró el checksum de ${CMAKE_ARCHIVE}." >&2
            exit 1
          fi
          printf '%s  %s\n' "${CMAKE_SHA256}" "${CMAKE_ARCHIVE}" | sha256sum --check --strict
          rm -rf /opt/cmake
          mkdir -p /opt/cmake
          tar -xzf "${CMAKE_ARCHIVE}" --strip-components=1 -C /opt/cmake
          export PATH="/opt/cmake/bin:${PATH}"

          # Python 3.6 solo admite Meson hasta 0.61.5.
          python3 -m pip install --no-cache-dir \
            pip==21.3.1 setuptools==59.6.0 wheel==0.37.1
          python3 -m pip install --no-cache-dir \
            meson==0.61.5 ninja==1.10.2.4

          echo "===== TOOLCHAIN ====="
          uname -a
          ldd --version | sed -n '1p'
          "${CC}" --version | sed -n '1p'
          "${CXX}" --version | sed -n '1p'
          cmake --version | sed -n '1p'
          meson --version
          ninja --version
          echo "====================="

          cd /work

          # Adaptaciones conservadoras para una consola sin escritorio:
          # 1) D-Bus no es necesario para ejecutar el juego y era una fuente
          #    de incompatibilidades con herramientas antiguas.
          # 2) El script de instalación original falla si una biblioteca
          #    opcional no aparece en ldd; se sustituye por uno tolerante.
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('/work/linux/Makefile')
          text = makefile.read_text()

          replacements = [
              (
                  '$(DOWNLOADS)/sdl2/CMakeLists.txt $(LIBDIR)/libdbus-1.so.3.38.3',
                  '$(DOWNLOADS)/sdl2/CMakeLists.txt'
              ),
              ('-DSDL_DBUS=yes', '-DSDL_DBUS=no'),
              # JPEG y PNG cubren los recursos de RPG Maker/Pokémon Essentials.
              # JXL arrastra Highway y exige toolchains más recientes sin aportar
              # nada a estos juegos, así que se desactiva en el build legado.
              ('-DSDL2IMAGE_JXL=yes', '-DSDL2IMAGE_JXL=no'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('No se encontró el fragmento esperado en linux/Makefile: ' + old)
              text = text.replace(old, new, 1)

          makefile.write_text(text)

          # Al desactivar JPEG XL en SDL_image, también hay que retirar sus
          # objetivos CMake de la detección de Meson. De lo contrario, la
          # compilación de SDL_image termina bien pero Meson intenta enlazar
          # objetivos que deliberadamente no existen.
          src_meson = Path('/work/src/meson.build')
          src_text = src_meson.read_text()
          old_modules = "modules: ['SDL2_image::SDL2_image-static', 'SDL2_image::brotlidec-static', 'SDL2_image::brotlicommon-static', 'SDL2_image::hwy', 'SDL2_image::jxl_dec-static']"
          new_modules = "modules: ['SDL2_image::SDL2_image-static']"
          occurrences = src_text.count(old_modules)
          if occurrences != 2:
              raise SystemExit('Se esperaban 2 listas de módulos JXL en src/meson.build y se encontraron {}'.format(occurrences))
          src_meson.write_text(src_text.replace(old_modules, new_modules))

          install_script = Path('/work/linux/install.sh')
          install_script.write_text(r'''#!/usr/bin/env bash
          set -u
          BINARY="$1"
          ARCH="$2"
          DEST="${MESON_INSTALL_PREFIX}/lib${ARCH}"
          mkdir -p "$DEST"

          copy_optional_dep() {
            local pattern="$1"
            local dep
            dep="$(ldd "$BINARY" 2>/dev/null | awk -v p="$pattern" '$1 ~ p && $3 ~ /^\// {print $3; exit}')"
            if [ -n "$dep" ] && [ -f "$dep" ]; then
              echo "Copying optional dependency: $dep"
              cp -L "$dep" "$DEST/"
            else
              echo "Optional dependency not linked: $pattern"
            fi
          }

          copy_optional_dep 'libruby'
          copy_optional_dep 'libcrypt'
          copy_optional_dep 'libbsd'
          exit 0
          ''')
          install_script.chmod(0o755)
          PY

          grep -F -- '-DSDL_DBUS=no' /work/linux/Makefile >/dev/null
          grep -F -- '-DSDL2IMAGE_JXL=no' /work/linux/Makefile >/dev/null
          if awk '/sdl2\/CMakeLists\.txt/ && /libdbus-1\.so\.3\.38\.3/ { found=1 } END { exit !found }' /work/linux/Makefile; then
            echo 'La dependencia obligatoria de D-Bus sigue presente en la regla de SDL2.' >&2
            exit 1
          fi
          if grep -F -- 'SDL2_image::jxl_dec-static' /work/src/meson.build >/dev/null; then
            echo 'Meson todavía solicita los objetivos de JPEG XL que se han desactivado.' >&2
            exit 1
          fi

          # Construcción limpia y reproducible. Evita reutilizar restos de una
          # ejecución fallida anterior.
          rm -rf /work/build \
                 /work/linux/build-aarch64 \
                 /work/linux/downloads/aarch64

          cd /work/linux
          echo "Construyendo dependencias en orden secuencial; cada biblioteca usa hasta 2 hilos."
          env -u MAKEFLAGS -u MFLAGS make NPROC=2

          cd /work
          # vars.sh está escrito para shells sin `set -u` y consulta variables
          # opcionales como ARCH y LD_LIBRARY_PATH. Se desactiva nounset solo
          # durante su carga y se vuelve a activar inmediatamente después.
          set +u
          source linux/vars.sh
          set -u

          meson setup build \
            --bindir=. \
            --prefix=/work/build/local \
            -Dgfx_backend=gles \
            -Dworkdir_current=true \
            -Dstatic_executable=true \
            -Dappimage=false \
            -Dcjk_fallback_font=false

          ninja -C build -j2
          ninja -C build install

          cd /work/build/local
          BIN="$(find . -maxdepth 1 -type f -name 'mkxp-z.*' -print -quit)"
          if [ -z "$BIN" ]; then
            echo "No se ha generado el ejecutable mkxp-z." >&2
            exit 1
          fi

          rm -rf stdlib scripts
          cp -a /work/linux/build-aarch64/lib/ruby/3.1.0 ./stdlib
          cp -a /work/mkxp.json .
          cp -a /work/scripts .
          cp -a /work/assets/LICENSE.mkxp-z-with-https.txt ./LICENSE.txt
          mkdir -p lib64

          # El ejecutable buscará sus bibliotecas junto al runtime, no en el
          # sistema de la consola.
          patchelf --set-rpath '$ORIGIN/lib64' "$BIN"

          # Copia de forma recursiva todas las bibliotecas dinámicas no
          # pertenecientes a glibc. Esto incluye libruby y, si son necesarias,
          # libstdc++, libgcc, libcrypt, libdrm, etc.
          BIN_PATH="$(readlink -f "$BIN")" python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          binary = Path(os.environ['BIN_PATH'])
          destination = binary.parent / 'lib64'
          destination.mkdir(exist_ok=True)

          search_dirs = [
              Path('/work/linux/build-aarch64/lib'),
              Path('/work/linux/build-aarch64/lib64'),
              Path('/usr/lib/aarch64-linux-gnu'),
              Path('/lib/aarch64-linux-gnu'),
              Path('/usr/lib'),
              Path('/lib'),
          ]

          # Estas bibliotecas forman parte de glibc o del cargador. La consola
          # debe usar sus propias copias (glibc 2.30).
          system_core = {
              'ld-linux-aarch64.so.1', 'libc.so.6', 'libm.so.6',
              'libpthread.so.0', 'libdl.so.2', 'librt.so.1',
              'libutil.so.1', 'libresolv.so.2', 'libanl.so.1',
              'linux-vdso.so.1'
          }

          needed_re = re.compile(r'\(NEEDED\).*\[(.+?)\]')

          def needed(path):
              output = subprocess.check_output(
                  ['readelf', '-d', str(path)],
                  stderr=subprocess.STDOUT,
                  universal_newlines=True,
              )
              return [m.group(1) for m in map(needed_re.search, output.splitlines()) if m]

          def resolve(name):
              for directory in search_dirs:
                  candidate = directory / name
                  if candidate.exists():
                      return candidate.resolve()
              return None

          queue = [binary]
          scanned = set()
          copied = {}
          missing = set()

          while queue:
              current = queue.pop(0)
              real_current = str(current.resolve())
              if real_current in scanned:
                  continue
              scanned.add(real_current)

              for name in needed(current):
                  if name in system_core:
                      continue
                  source = resolve(name)
                  if source is None:
                      missing.add(name)
                      continue
                  target = destination / name
                  if name not in copied:
                      shutil.copy2(str(source), str(target))
                      copied[name] = str(source)
                      queue.append(target)

          if missing:
              print('Bibliotecas no resueltas:', ', '.join(sorted(missing)), file=sys.stderr)
              sys.exit(1)

          print('Bibliotecas incluidas:')
          for name, source in sorted(copied.items()):
              print('  {} <- {}'.format(name, source))
          PY

          # Cada biblioteca incluida busca sus dependencias en la misma carpeta.
          shopt -s nullglob
          bundled_libs=(lib64/*)
          if [ "${#bundled_libs[@]}" -eq 0 ]; then
            echo "No se ha incluido ninguna biblioteca dinámica en lib64." >&2
            exit 1
          fi
          for lib in "${bundled_libs[@]}"; do
            lib_desc="$(file -b "$lib")"
            if [[ "$lib_desc" == *ELF* ]]; then
              patchelf --set-rpath '$ORIGIN' "$lib" || true
              strip --strip-unneeded "$lib" || true
            fi
          done
          strip --strip-unneeded "$BIN" || true

          export LD_LIBRARY_PATH="$PWD/lib64"

          {
            echo "===== K36S BUILD INFO ====="
            echo "Commit: $(git -C /work rev-parse --short HEAD)"
            echo "Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Compilador C: $(${CC} --version | sed -n '1p')"
            echo "Compilador C++: $(${CXX} --version | sed -n '1p')"
            echo "CMake: $(cmake --version | sed -n '1p')"
            echo "Meson: $(meson --version)"
            echo "Binario: $(file "$BIN")"
            echo
            echo "RPATH/RUNPATH:"
            readelf -d "$BIN" | grep -E 'RPATH|RUNPATH' || true
            echo
            echo "Dependencias resueltas:"
            ldd "$BIN"
            echo
            echo "Versiones GLIBC requeridas:"
            for elf in "$BIN" "${bundled_libs[@]}"; do
              elf_desc="$(file -b "$elf")"
              if [[ "$elf_desc" == *ELF* ]]; then
                max_glibc="$(readelf --version-info "$elf" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -Vu | tail -n 1 || true)"
                printf '%s: %s\n' "$elf" "${max_glibc:-ninguna}"
                if [ -n "$max_glibc" ] && dpkg --compare-versions "$max_glibc" gt '2.30'; then
                  echo "ERROR: $elf exige GLIBC_$max_glibc, superior a GLIBC_2.30." >&2
                  exit 1
                fi
              fi
            done
            echo
            sha256sum "$BIN" lib64/* 2>/dev/null || true
          } | tee BUILD-INFO.txt

          if ! LDD_OUTPUT="$(ldd "$BIN" 2>&1)"; then
            echo "ldd no pudo analizar el ejecutable:" >&2
            printf '%s\n' "$LDD_OUTPUT" >&2
            exit 1
          fi
          if grep -q 'not found' <<< "$LDD_OUTPUT"; then
            echo "Quedan bibliotecas sin resolver." >&2
            printf '%s\n' "$LDD_OUTPUT" >&2
            exit 1
          fi

          BIN_DESC="$(file -b "$BIN")"
          if [[ "$BIN_DESC" != *"ARM aarch64"* ]]; then
            echo "El ejecutable generado no es ARM64/aarch64." >&2
            echo "$BIN_DESC" >&2
            exit 1
          fi

          chmod -R a+rX /work/build /work/build-logs
          echo "Compilación y verificaciones completadas correctamente."
          CONTAINER_SCRIPT

          chmod +x "$RUNNER_TEMP/build-k36s-container.sh"

      - name: Build and verify inside Ubuntu 18.04 ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          docker run --rm \
            --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP/build-k36s-container.sh:/build-k36s.sh:ro" \
            --workdir /work \
            arm64v8/ubuntu:18.04 \
            bash /build-k36s.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/full-build.log"

      - name: Upload K36S runtime
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.k36s.glibc227.arm64.v7
          path: build/local
          if-no-files-found: error
          compression-level: 9

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.k36s.build-diagnostics.v7
          path: |
            build-logs
            build/meson-logs
            .github/workflows/k36s-legacy-arm64.yml
            linux/downloads/**/CMakeFiles/CMakeError.log
            linux/downloads/**/CMakeFiles/CMakeOutput.log
            linux/downloads/**/config.log
          if-no-files-found: ignore
          retention-days: 7
